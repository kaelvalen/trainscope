services:
  trainscope:
    build:
      context: .
      dockerfile: Dockerfile
    image: trainscope:latest
    container_name: trainscope
    ports:
      - "7007:7007"
    volumes:
      - trainscope-runs:/data/trainscope_runs:rw
    environment:
      # Uncomment to enable API-key authentication.
      # TRAINSCOPE_API_KEY: "${TRAINSCOPE_API_KEY:-}"
      # Uncomment to enable HTTP Basic authentication.
      # TRAINSCOPE_BASIC_AUTH: "${TRAINSCOPE_BASIC_AUTH:-}"
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7007/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  trainscope-runs:
    driver: local
