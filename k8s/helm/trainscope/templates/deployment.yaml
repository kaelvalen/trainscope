apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trainscope.fullname" . }}
  labels:
    {{- include "trainscope.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trainscope.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trainscope.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: trainscope
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: runs
              mountPath: /data/trainscope_runs
      volumes:
        - name: runs
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "trainscope.fullname" . }}-runs
          {{- else }}
          emptyDir: {}
          {{- end }}
