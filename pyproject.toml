[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trainscope"
version = "1.6.0"
description = "Post-mortem debugger for LLM training loss spikes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["llm", "training", "debugging", "loss-spike", "pytorch", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "torch>=2.0",
    "pyarrow>=14.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "click>=8.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyyaml>=6.0",
    "fsspec>=2024.0",
]

[project.urls]
Homepage = "https://github.com/kaelvalen/trainscope"
Repository = "https://github.com/kaelvalen/trainscope"
"Bug Tracker" = "https://github.com/kaelvalen/trainscope/issues"

[project.optional-dependencies]
integrations = [
    "wandb>=0.16",
    "tensorboard>=2.16",
    "mlflow>=2.12",
]
auth = [
]
telemetry = [
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "aiofiles>=23.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]
remote = [
    "fsspec>=2024.0",
]
detectors = [
    "ruptures>=1.1",
    "scikit-learn>=1.4",
]
logging = [
    "structlog>=24.0",
]

[project.scripts]
trainscope = "trainscope.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["trainscope"]
# The React build (npm run build) emits into trainscope/ui/static/ which is not
# tracked by VCS. Mark it as an artifact so hatchling includes it in the wheel
# even when building in a clean git checkout where the directory may be absent.
artifacts = ["trainscope/ui/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true
