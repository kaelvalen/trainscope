replicaCount: 1

image:
  repository: trainscope
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 7007

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: trainscope.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env: {}
# env:
#   TRAINSCOPE_API_KEY: "your-secret-key"
#   TRAINSCOPE_BASIC_AUTH: "admin:strong-password"

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources: {}
# resources:
#   limits:
#     cpu: 1000m
#     memory: 1Gi
#   requests:
#     cpu: 100m
#     memory: 256Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: 7007
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /api/health
    port: 7007
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
